<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikky Exchange</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* BASE */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#070b14;
color:white;
overflow-x:hidden;
}

/* GRID */
body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:40px 40px;
z-index:-2;
animation:grid 12s linear infinite;
}

@keyframes grid{
from{transform:translateY(0)}
to{transform:translateY(40px)}
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(15,23,42,.9);
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-weight:800;
color:#4de1ff;
font-size:14px;
}

.profile{
width:40px;
height:40px;
border-radius:50%;
border:2px solid #4de1ff;
object-fit:cover;
}

/* LAYOUT */
.container{
max-width:420px;
margin:auto;
padding:16px;
}

.card{
background:rgba(15,23,42,.85);
padding:15px;
border-radius:16px;
margin-bottom:12px;
border:1px solid rgba(255,255,255,.06);
}

/* INPUT */
label{
font-size:11px;
color:#9ca3af;
display:block;
margin-top:10px;
}

input,select{
width:100%;
padding:12px;
border-radius:12px;
margin-top:6px;
border:1px solid rgba(255,255,255,.06);
background:#0b1220;
color:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#4de1ff;
font-weight:700;
cursor:pointer;
}

/* RESULT */
.result{
text-align:center;
font-size:22px;
font-weight:800;
color:#4de1ff;
margin-top:10px;
}

/* RECEIPT */
.receipt{
display:none;
background:white;
color:black;
padding:12px;
border-radius:12px;
margin-top:10px;
font-size:11px;
}

.row{
display:flex;
justify-content:space-between;
margin:3px 0;
}

/* ORDER BOOK */
.ob-title{
font-size:11px;
color:#4de1ff;
font-weight:700;
margin-bottom:8px;
}

.ob-mid{
text-align:center;
font-weight:800;
color:#4de1ff;
margin:6px 0;
}

/* FEED */
.feed-item{
font-size:10px;
display:flex;
justify-content:space-between;
padding:6px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.buy{color:#00ff9d}
.sell{color:#ff4d4d}

/* TOAST */
#toast{
position:fixed;
top:12px;
right:12px;
z-index:9999;
}

.toast{
background:rgba(15,23,42,.95);
padding:10px;
border-radius:10px;
margin-bottom:6px;
font-size:11px;
animation:slide .3s ease;
}

@keyframes slide{
from{transform:translateX(120%)}
to{transform:translateX(0)}
}

</style>
</head>

<body>

<div id="toast"></div>

<div class="header">
<div class="logo">IKKY EXCHANGE PRO</div>
<img src="./profile.png" class="profile">
</div>

<div class="container">

<!-- CONVERT -->
<div class="card">

<label>Exchange</label>
<select id="ex">
<option>Binance</option>
<option>Bitget</option>
<option>MEXC</option>
<option>OKX</option>
</select>

<label>ID Pengirim</label>
<input id="sid">

<label>Nama Pengirim</label>
<input id="sname">

<label>USDT</label>
<input type="number" id="usdt">

<button onclick="convert()">Convert</button>

<div class="result" id="result">Rp 0</div>

</div>

<!-- RECEIPT -->
<div class="card">

<div class="receipt" id="receipt">

<div class="row"><b>ID</b><span id="tid"></span></div>
<div class="row"><b>EX</b><span id="tex"></span></div>
<div class="row"><b>EX ID</b><span id="texid"></span></div>
<div class="row"><b>USDT</b><span id="tusdt"></span></div>
<div class="row"><b>TOTAL</b><span id="ttotal"></span></div>

</div>

<button onclick="sendWA()">Kirim ke WhatsApp</button>

</div>

<!-- ORDER BOOK -->
<div class="card">
<div class="ob-title">Order Book</div>
<div class="ob-mid" id="mid">Rp 0</div>
</div>

<!-- FEED -->
<div class="card">
<div class="ob-title">Live Feed</div>
<div id="feed"></div>
</div>

</div>

<script>

let rate = 16700;
let last = {};
let mid = 16700;

/* TOAST */
function toast(msg){
let t=document.createElement("div");
t.className="toast";
t.innerText=msg;
document.getElementById("toast").appendChild(t);
setTimeout(()=>t.remove(),3000);
}

/* CONVERT */
function convert(){

let u=parseFloat(document.getElementById("usdt").value)||0;
if(u<=0)return;

let ex=document.getElementById("ex").value;

let id="IKKY-"+Math.floor(Math.random()*999999);
let total=u*rate;

last={id,ex,u,total};

document.getElementById("receipt").style.display="block";

document.getElementById("tid").innerText=id;
document.getElementById("tex").innerText=ex;
document.getElementById("texid").innerText="AUTO-"+Math.floor(Math.random()*99999);
document.getElementById("tusdt").innerText=u;
document.getElementById("ttotal").innerText="Rp "+Math.floor(total);

document.getElementById("result").innerText="Rp "+Math.floor(total);

toast("Transaction created");
}

/* ORDER PRICE */
setInterval(()=>{
mid += (Math.random()*200-100);
document.getElementById("mid").innerText="Rp "+Math.floor(mid).toLocaleString("id-ID");
},1500);

/* FEED */
setInterval(()=>{
let f=document.getElementById("feed");

let type=Math.random()>0.5?"BUY":"SELL";
let price=16000+Math.random()*2000;
let item=document.createElement("div");
item.className="feed-item";

item.innerHTML=`
<span class="${type==="BUY"?"buy":"sell"}">${type}</span>
<span>${Math.floor(price)}</span>
<span>${new Date().toLocaleTimeString()}</span>
`;

f.prepend(item);
if(f.children.length>8)f.removeChild(f.lastChild);

},1200);

/* WHATSAPP (FINAL CLEAN FORMAT) */
function sendWA(){

let msg =
`💰 IKKY EXCHANGE SYSTEM

━━━━━━━━━━━━━━
📥 TRANSACTION RECEIPT

ID TRANSAKSI : ${last.id}
EXCHANGE     : ${last.ex}

━━━━━━━━━━━━━━
📤 PENGIRIM
ID           : ${document.getElementById("sid").value}
A/N          : ${document.getElementById("sname").value}

━━━━━━━━━━━━━━
📊 DETAIL
USDT         : ${last.u}
TOTAL        : Rp ${Math.floor(last.total)}

━━━━━━━━━━━━━━
📥 PENERIMA
A/N          : Lucky Wahyu Mukti

━━━━━━━━━━━━━━
📌 CATATAN
Harap kirim screenshot dari exchange
ke admin untuk proses verifikasi

Status: PENDING CONFIRMATION`;

window.open("https://wa.me/62881010250186?text="+encodeURIComponent(msg));
}

</script>

</body>
