<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKKY EXCHANGE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:#070b14;
color:#fff;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#0f172a;
border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{color:#4de1ff;font-weight:800;}

.profile{
width:42px;height:42px;border-radius:50%;
border:2px solid #4de1ff;
}

.container{
max-width:420px;
margin:auto;
padding:14px;
}

.card{
background:#0f172a;
padding:14px;
border-radius:12px;
margin-top:10px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-family:Poppins;
}

input,select{background:#07101f;color:#fff;}

button{
background:#4de1ff;
font-weight:700;
cursor:pointer;
}

.receiver{
background:#07101f;
padding:12px;
border-radius:10px;
margin-top:10px;
font-size:12px;
}

.admin{
font-size:10px;
color:#64748b;
opacity:.7;
}

.result{
text-align:center;
font-size:22px;
font-weight:800;
color:#4de1ff;
margin-top:10px;
}

.receipt{
display:none;
background:#fff;
color:#000;
padding:12px;
border-radius:10px;
margin-top:10px;
font-size:12px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">IKKY EXCHANGE</div>
<img src="./profile.png" class="profile">
</div>

<div class="container">

<div class="card">

<select id="ex" onchange="updateReceiver()">
<option>Binance</option>
<option>Bitget</option>
<option>MEXC</option>
<option>OKX</option>
</select>

<div class="receiver">
<div class="admin">ADMIN VERIFIED</div>
<div><b>ID Penerima</b></div>
<div id="receiverId">929443451</div>
<div style="font-size:11px;margin-top:5px;color:#22c55e;">
A/N: Lucky Wahyu Mukti
</div>
</div>

<input id="sid" placeholder="ID Pengirim">
<input id="sname" placeholder="Nama Pengirim">
<input id="usdt" type="number" placeholder="Jumlah USDT">

<button onclick="convert()">CONVERT</button>

<div class="result" id="result">Rp 0</div>

</div>

<div class="card">
<div class="receipt" id="receipt"></div>
<button onclick="sendWA()">KIRIM WA</button>
</div>

</div>

<script>

const receiverIDs = {
Binance:"929443451",
Bitget:"6397357978",
MEXC:"32871600",
OKX:"589469267746480492"
};

let rate = 17000;
let last = {};

function updateReceiver(){
document.getElementById("receiverId").innerText =
receiverIDs[document.getElementById("ex").value];
}

/* RATE LOGIC FIX */
function getFee(usdt){

if(usdt <= 1){
return 0.06; // 6%
}
else if(usdt <= 10){
return 0.05; // 5%
}
else{
return 0.03; // 3%
}

}

async function convert(){

const usdt = parseFloat(document.getElementById("usdt").value);
const sid = document.getElementById("sid").value;
const sname = document.getElementById("sname").value;
const ex = document.getElementById("ex").value;

if(!usdt || !sid || !sname){
alert("Lengkapi data");
return;
}

try{
const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=idr");
const data = await res.json();
rate = Math.round(data.tether.idr);
}catch(e){
rate = 17000;
}

let feePercent = getFee(usdt);

let base = usdt * rate;
let cut = usdt * feePercent * rate;
let fee = 500;

let total = Math.floor(base - cut - fee);

let id = "IKKY-" + Math.floor(Math.random()*999999);
let ref = "REF-" + Date.now().toString(36).toUpperCase();

last = {id,ref,usdt,ex,sid,sname,total,rate,feePercent};

document.getElementById("result").innerText =
"Rp " + total.toLocaleString("id-ID");

document.getElementById("receipt").style.display = "block";

document.getElementById("receipt").innerText =

`┌──── RECEIPT ────
ID: ${id}
REF: ${ref}
STATUS: PENDING
────────────
EX: ${ex}
PENGIRIM: ${sid}
NAMA: ${sname}
────────────
USDT: ${usdt}
RATE: ${rate}
FEE: ${(feePercent*100)}%
ADMIN FEE: Rp 500
TOTAL: Rp ${total}
────────────
CATATAN:
Harap kirim screenshot dari exchange
ke admin untuk proses verifikasi.
`;

}

function sendWA(){

if(!last.id){
alert("Convert dulu");
return;
}

let msg = `
IKKY EXCHANGE
ID: ${last.id}
REF: ${last.ref}

USDT: ${last.usdt}
RATE: ${last.rate}
FEE: ${(last.feePercent*100)}%
TOTAL: Rp ${last.total}

CATATAN:
Harap kirim screenshot bukti transaksi dari exchange
ke admin untuk proses verifikasi.

⚠️ Transaksi akan diproses setelah diverifikasi.
`;

window.open("https://wa.me/62881010250186?text=" + encodeURIComponent(msg));
}

updateReceiver();

</script>

</body>
</html>
