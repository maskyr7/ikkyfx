<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKKY EXCHANGE PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:#070b14;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:40px 40px;
animation:gridMove 12s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{transform:translateY(0)}
to{transform:translateY(40px)}
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#0f172a;
border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
font-weight:800;
color:#4de1ff;
display:flex;
align-items:center;
gap:8px;
}

.logo span{
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{opacity:.4}
}

/* PROFILE */
.profile-wrap{
display:flex;
align-items:center;
gap:10px;
}

.profile{
width:40px;
height:40px;
border-radius:50%;
border:2px solid #4de1ff;
object-fit:cover;
animation:pop .8s ease;
}

@keyframes pop{
from{transform:scale(0)}
to{transform:scale(1)}
}

/* TICKER */
.ticker{
background:#0b1220;
padding:8px;
overflow:hidden;
white-space:nowrap;
border-bottom:1px solid rgba(255,255,255,.05);
}

.ticker span{
display:inline-block;
padding-left:100%;
animation:scroll 10s linear infinite;
color:#4de1ff;
font-size:12px;
}

@keyframes scroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.container{max-width:420px;margin:auto;padding:15px;}

.card{
background:#0f172a;
padding:15px;
border-radius:16px;
margin-bottom:12px;
}

label{font-size:12px;color:#94a3b8;}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:10px;
background:#07101f;
color:#fff;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#4de1ff;
font-weight:700;
cursor:pointer;
}

.result{
text-align:center;
font-size:22px;
margin-top:10px;
color:#4de1ff;
font-weight:800;
}

/* RECEIPT */
.receipt{
display:none;
background:#fff;
color:#000;
padding:12px;
border-radius:12px;
font-size:12px;
margin-top:10px;
}

.row{display:flex;justify-content:space-between;margin:4px 0;}

.badge{
background:#22c55e;
color:#fff;
padding:2px 6px;
border-radius:6px;
font-size:10px;
}

.small{
font-size:10px;
color:#888;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">IKKY EXCHANGE <span>✔</span></div>

<div class="profile-wrap">
<img src="./profile.png" class="profile">
</div>
</div>

<div class="ticker">
<span>IKKY EXCHANGE • FAST CONVERT • SECURE SYSTEM • REAL TIME RATE • VERIFIED ADMIN •</span>
</div>

<div class="container">

<div class="card">

<label>Exchange</label>
<select id="ex" onchange="setReceiver()">
<option value="Binance">Binance</option>
<option value="Bitget">Bitget</option>
<option value="MEXC">MEXC</option>
<option value="OKX">OKX</option>
</select>

<div style="margin-top:10px;padding:10px;background:#07101f;border-radius:10px;">
<div class="small">ADMIN VERIFIED RECEIVER</div>
<div id="receiverId">-</div>
</div>

<label>ID Pengirim</label>
<input id="sid" placeholder="ID exchange kamu">

<label>Nama Pengirim</label>
<input id="sname" placeholder="Nama akun kamu">

<label>USDT</label>
<input id="usdt" type="number" placeholder="0">

<button onclick="convert()">CONVERT</button>

<div class="result" id="result">Rp 0</div>

</div>

<div class="card">

<div class="receipt" id="receipt">

<h3>💰 RECEIPT</h3>

<div class="row"><b>ID</b><span id="tid"></span></div>
<div class="row"><b>REF</b><span id="tref"></span></div>
<div class="row"><b>STATUS</b><span class="badge">PENDING</span></div>

<hr>

<div class="row"><b>EXCHANGE</b><span id="tex"></span></div>
<div class="row"><b>ID PENGIRIM</b><span id="tsid"></span></div>
<div class="row"><b>NAMA</b><span id="tsname"></span></div>

<hr>

<div class="row"><b>USDT</b><span id="tusdt"></span></div>
<div class="row"><b>RATE</b><span id="trate"></span></div>
<div class="row"><b>FEE</b><span>Rp 500</span></div>
<div class="row"><b>TOTAL</b><span id="ttotal"></span></div>

</div>

<button onclick="sendWA()">KIRIM WA</button>

</div>

</div>

<script>

const receiver = {
Binance:"929443451",
Bitget:"6397357978",
MEXC:"32871600",
OKX:"589469267746480492"
};

let last = {};
let rate = 17000;

function setReceiver(){
let ex = document.getElementById("ex").value;
document.getElementById("receiverId").innerText = receiver[ex];
}

function makeRef(){
return "REF-" + Math.random().toString(36).substr(2,8).toUpperCase();
}

async function convert(){

let sid = document.getElementById("sid").value;
let sname = document.getElementById("sname").value;
let usdt = parseFloat(document.getElementById("usdt").value);

if(!sid || !sname || !usdt){
alert("Lengkapi data");
return;
}

try{
let res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=idr");
let data = await res.json();
rate = data.tether.idr;
}catch(e){ rate=17000; }

let ex = document.getElementById("ex").value;
let fee = 500;
let total = (usdt * rate) - fee;

let ref = makeRef();
let id = "IKKY-" + Math.floor(Math.random()*999999);

last = {id,ref,ex,sid,sname,usdt,total};

document.getElementById("tid").innerText = id;
document.getElementById("tref").innerText = ref;
document.getElementById("tex").innerText = ex;
document.getElementById("tsid").innerText = sid;
document.getElementById("tsname").innerText = sname;
document.getElementById("tusdt").innerText = usdt;
document.getElementById("trate").innerText = rate;
document.getElementById("ttotal").innerText = "Rp " + total.toLocaleString();

document.getElementById("result").innerText = "Rp " + total.toLocaleString();

document.getElementById("receipt").style.display = "block";
}

function sendWA(){

if(!last.id){
alert("Convert dulu");
return;
}

let msg = `💰 IKKY EXCHANGE ✔ VERIFIED
━━━━━━━━━━━━━━
📥 TRANSACTION RECEIPT
ID: ${last.id}
REF: ${last.ref}
STATUS: PENDING
━━━━━━━━━━━━━━
📤 PENGIRIM
ID: ${last.sid}
A/N: ${last.sname}
━━━━━━━━━━━━━━
📊 DETAIL
USDT: ${last.usdt}
FEE: Rp 500
TOTAL: ${last.total}
━━━━━━━━━━━━━━
📌 CATATAN:
Harap kirim screenshot bukti transaksi dari exchange
ke admin untuk proses verifikasi.

⚠️ Transaksi akan diproses setelah diverifikasi.`;

window.open("https://wa.me/62881010250186?text="+encodeURIComponent(msg));
}

setReceiver();

</script>

</body>
</html>
